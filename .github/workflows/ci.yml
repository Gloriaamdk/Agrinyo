# Intégration continue : tests du backend, lint et build du frontend, construction des images Docker.
# Le déploiement est fait par Coolify, qui reconstruit depuis master à chaque push (voir DEPLOIEMENT.md).
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (tests Django)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agrinyo
          POSTGRES_PASSWORD: ci-seulement
          POSTGRES_DB: agrinyo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agrinyo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Mêmes réglages qu'en production, base de test jetable.
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-cle-jetable-sans-valeur-en-production
      DB_NAME: agrinyo
      DB_USER: agrinyo
      DB_PASSWORD: ci-seulement
      DB_HOST: localhost
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Vérifications Django
        run: python manage.py check
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test --noinput

  frontend:
    name: Frontend (lint et build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    name: Images Docker (construction)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Image frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          # Adresse factice : l'image refuse l'adresse d'exemple de frontend/.env.production.
          build-args: |
            VITE_API_URL=https://api.ci.invalid
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
